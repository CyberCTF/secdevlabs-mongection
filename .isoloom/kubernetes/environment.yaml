apiVersion: v1
kind: Namespace
metadata:
  name: isoloom-secdevlabs-mongection
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      isoloom.com/machine: mongo
  template:
    metadata:
      labels:
        isoloom.com/machine: mongo
        net.isoloom.com/lab: member
    spec:
      hostname: mongo
      initContainers:
      - name: isoloom-probe
        image: busybox:1.37.0-musl
        command:
        - /bin/cp
        - /bin/busybox
        - /probe/busybox
        volumeMounts:
        - name: isoloom-probe
          mountPath: /probe
      containers:
      - name: mongo
        image: isoloom/secdevlabs-mongection-mongo
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 27017
        readinessProbe:
          exec:
            command:
            - /.isoloom-probe/busybox
            - sh
            - -c
            - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 27017
          periodSeconds: 5
          failureThreshold: 60
        resources:
          limits:
            cpu: '1'
            memory: 512Mi
        volumeMounts:
        - name: vol-data
          mountPath: /data/db
        - name: isoloom-probe
          mountPath: /.isoloom-probe
          readOnly: true
      nodeSelector:
        kubernetes.io/arch: amd64
      volumes:
      - name: vol-data
        persistentVolumeClaim:
          claimName: mongo-data
      - name: isoloom-probe
        emptyDir: {}
---
