# Generated by isoloom from isoloom.yml. Don't edit: change isoloom.yml and run
# `isoloom generate`. `isoloom check` fails when this file is out of date.
# Start:  docker compose -f .isoloom/docker/compose.yml up -d --wait
# Checks: isoloom test docker (or: docker compose -f .isoloom/docker/compose.yml --profile check run --rm isoloom-check, and isoloom-check-<machine>)
# Stop:   docker compose -f .isoloom/docker/compose.yml down -v

name: secdevlabs-mongection
services:
  mongo:
    build:
      context: ../../build/mongo
    image: isoloom/secdevlabs-mongection-mongo
    platform: linux/amd64
    hostname: mongo
    networks:
      lab:
        ipv4_address: 10.60.97.20
    volumes:
    - mongo-data:/data/db
    - isoloom-probe-amd64:/.isoloom-probe:ro
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 27017
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    labels:
      isoloom.service.mongodb: tcp:27017
    restart: unless-stopped
  mongo-routes:
    image: alpine:3.20
    network_mode: service:mongo
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - (ip route del default 2>/dev/null || true) && exec sleep infinity
    healthcheck:
      test:
      - CMD-SHELL
      - '! ip route | grep -q ''^default'''
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      mongo:
        condition: service_started
    restart: unless-stopped
  server:
    build:
      context: ../../build/server
    image: isoloom/secdevlabs-mongection-server
    platform: linux/amd64
    hostname: server
    networks:
      lab:
        ipv4_address: 10.60.97.10
    ports:
    - ${ISOLOOM_PUBLISH_ADDRESS:-127.0.0.1}:${ISOLOOM_PUBLISH_FIXED:+10001}:10001
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 10001
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    volumes:
    - isoloom-probe-amd64:/.isoloom-probe:ro
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
      mongo-routes:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    labels:
      isoloom.service.web: http:10001
    restart: unless-stopped
  server-routes:
    image: alpine:3.20
    network_mode: service:server
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - (ip route del default 2>/dev/null || true) && exec sleep infinity
    healthcheck:
      test:
      - CMD-SHELL
      - '! ip route | grep -q ''^default'''
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      server:
        condition: service_started
    restart: unless-stopped
  isoloom-check:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - -c
    - ip route del default 2>/dev/null; exec sh /isoloom/run.sh
    volumes:
    - ./checks/networks.sh:/isoloom/run.sh:ro
    - ../..:/isoloom/project:ro
    networks:
      lab: null
    user: '0'
    cap_add:
    - NET_ADMIN
    depends_on:
      mongo:
        condition: service_healthy
      mongo-routes:
        condition: service_healthy
      server:
        condition: service_healthy
      server-routes:
        condition: service_healthy
  isoloom-check-mongo:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    volumes:
    - ./checks/mongo.sh:/isoloom/run.sh:ro
    network_mode: service:mongo
    depends_on:
      mongo:
        condition: service_healthy
      mongo-routes:
        condition: service_healthy
      server:
        condition: service_healthy
      server-routes:
        condition: service_healthy
  isoloom-check-server:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    volumes:
    - ./checks/server.sh:/isoloom/run.sh:ro
    network_mode: service:server
    depends_on:
      mongo:
        condition: service_healthy
      mongo-routes:
        condition: service_healthy
      server:
        condition: service_healthy
      server-routes:
        condition: service_healthy
  isoloom-probe-amd64:
    image: busybox:1.37.0-musl
    platform: linux/amd64
    entrypoint:
    - /bin/cp
    - /bin/busybox
    - /probe/busybox
    volumes:
    - isoloom-probe-amd64:/probe
    network_mode: none
    restart: no
networks:
  lab:
    ipam:
      config:
      - subnet: 10.60.97.0/24
        gateway: 10.60.97.1
volumes:
  mongo-data: {}
  isoloom-probe-amd64: {}
